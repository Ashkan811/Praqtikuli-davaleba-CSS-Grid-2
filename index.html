<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Online Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="products-container">
        <div class="card card1">
            <img src="https://png.pngtree.com/png-vector/20250522/ourmid/pngtree-modern-laptop-computer-with-screen-open-technology-digital-device-png-image_16345445.png" alt="laptop's photo">
            <h3>Laptop</h3>
            <span>600$</span>
            <button class="cart">Add to Cart</button>
        </div>
        <div class="card card2">
            <img src="45a73e87-6a50-4460-b4ef-143e2aecdeea_Thumb-removebg-preview.png" alt="smartphone's photo">
            <h3>Smartphone</h3>
            <span>1000$</span>
            <button class="cart">Add to Cart</button>
        </div>
        <div class="card card3">
            <img src="https://png.pngtree.com/png-vector/20250703/ourmid/pngtree-black-headphones-sleek-3d-render-png-image_16600605.webp" alt="headphone's photo">
            <h3>Headphones</h3>
            <span>100$</span>
            <button class="cart">Add to Cart</button>
        </div>
        <div class="card card4">
            <img src="https://static.vecteezy.com/system/resources/previews/047/084/335/non_2x/smart-watch-on-transparent-background-png.png" alt="smart watch photo">
            <h3>Smart Watch</h3>
            <span>600$</span>
            <button class="cart">Add to Cart</button>
        </div>
        <div class="card card5">
            <img src="https://png.pngtree.com/png-clipart/20250217/original/pngtree-gaming-keyboard-with-transparency-background-png-image_20453275.png" alt="keyboard photo">
            <h3>Keyboard</h3>
            <span>250$</span>
            <button class="cart">Add to Cart</button>
        </div>
        <div class="card card6">
            <img src="https://static.vecteezy.com/system/resources/thumbnails/055/392/051/small_2x/modern-rgb-gaming-mouse-isolated-on-transparent-background-free-png.png" alt="mouse photo">
            <h3>Mouse</h3>
            <span>50$</span>
            <button class="cart">Add to Cart</button>
        </div>
        <div class="card card7">
            <img src="https://png.pngtree.com/png-clipart/20240316/original/pngtree-long-makeup-game-monitor-gaming-scifi-png-image_14608731.png" alt="monitor's photo">
            <h3>Monitor</h3>
            <span>800$</span>
            <button class="cart">Add to Cart</button>
        </div>
        <div class="card card8">
            <img src="https://png.pngtree.com/png-clipart/20241114/original/pngtree-black-dslr-camera-with-large-lens-clipart-illustration-stock-photo-png-image_17009796.png" alt="camera's photo">
            <h3>Camera</h3>
            <span>2000$</span>
            <button class="cart">Add to Cart</button>
        </div>
    </section>
</body>
</html>
